            <text x="35" y="45" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800">Vector A: Delayed Nocturnal Battery Warning</text>
            <text x="35" y="80" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Technicians alerted only after DC bus drops below 42V—when cellular cells have already died.</text>

