<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="180" x2="1080" y2="180" />
    <line x1="0" y1="360" x2="1080" y2="360" />
    <line x1="0" y1="540" x2="1080" y2="540" />
    <line x1="0" y1="720" x2="1080" y2="720" />
    <line x1="0" y1="900" x2="1080" y2="900" />
    <line x1="180" y1="0" x2="180" y2="1080" />
    <line x1="360" y1="0" x2="360" y2="1080" />
    <line x1="540" y1="0" x2="540" y2="1080" />
    <line x1="720" y1="0" x2="720" y2="1080" />
    <line x1="900" y1="0" x2="900" y2="1080" />
  </g>

  <!-- Top Category Pill -->
  <rect x="80" y="80" width="310" height="42" rx="21" fill="#0C4A6E" stroke="#0284C7" stroke-width="1.5" />
  <text x="235" y="107" fill="#38BDF8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle">INDUSTRY INSIGHTS · 2026</text>

  <!-- Title -->
  <text x="80" y="180" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" line-height="1.2">
    <tspan x="80" dy="0">Telecom Infrastructure &amp;</tspan>
    <tspan x="80" dy="56">The Hybrid Power Reality</tspan>
  </text>
  <text x="80" y="295" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="500">
    Managing auxiliary grid volatility across 789+ cell sites with intelligent telemetry
  </text>

  <!-- Metric 1: 14 Cutover Events -->
  <rect x="80" y="360" width="440" height="260" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="120" y="425" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="48" font-weight="800">14 / day</text>
  <text x="120" y="465" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">Grid Transitions</text>
  <text x="120" y="505" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" width="360">
    Remote base stations endure up to 14 power cutovers daily between national grid and diesel gensets.
  </text>
  <rect x="120" y="565" width="280" height="8" rx="4" fill="#1E293B" />
  <rect x="120" y="565" width="220" height="8" rx="4" fill="#0284C7" />

  <!-- Metric 2: 99.8% SLA -->
  <rect x="560" y="360" width="440" height="260" rx="20" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <text x="600" y="425" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="48" font-weight="800">99.8%</text>
  <text x="600" y="465" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="700">Nationwide SLA Uptime</text>
  <text x="600" y="505" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16">
    Sustained network availability through automated low-voltage cutoffs and rapid alarm escalation.
  </text>
  <rect x="600" y="565" width="280" height="8" rx="4" fill="#1E293B" />
  <rect x="600" y="565" width="275" height="8" rx="4" fill="#10B981" />

  <!-- Bottom Visual: Telemetry Pipeline Box -->
  <rect x="80" y="660" width="920" height="270" rx="24" fill="#0B132B" stroke="#1D4ED8" stroke-width="2" />
  <text x="120" y="715" fill="#60A5FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" letter-spacing="1">
    AUTOMATED LOW-VOLTAGE CUTOVER LOGIC
  </text>

  <!-- Flow Steps -->
  <g transform="translate(120, 750)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="240" height="120" rx="14" fill="#1E293B" stroke="#475569" />
    <text x="20" y="35" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">DC Voltage &lt; 48V</text>
    <text x="20" y="65" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Galooli RMS Sensor</text>
    <text x="20" y="90" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12">Telemetry Stream</text>

    <!-- Arrow 1 -->
    <path d="M 255 60 L 285 60" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)" />
    
    <!-- Node 2 -->
    <rect x="300" y="0" width="240" height="120" rx="14" fill="#1E293B" stroke="#0284C7" />
    <text x="320" y="35" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Decay Slope Check</text>
    <text x="320" y="65" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Predict &lt;90m To Drain</text>
    <text x="320" y="90" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12">Suppress False Alarm</text>

    <!-- Node 3 -->
    <rect x="600" y="0" width="240" height="120" rx="14" fill="#1E293B" stroke="#10B981" />
    <text x="620" y="35" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Field Dispatch</text>
    <text x="620" y="65" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Automated Engineer Escalation</text>
    <text x="620" y="90" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12">Zero SLA Breach</text>
  </g>

  <!-- Footer Branding -->
  <text x="80" y="985" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">
    Toluwanimi Akinyemi · Telecommunications Network Operations &amp; AI Automation Engineer
  </text>
  <text x="1000" y="985" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" text-anchor="end">
    SLA 99.8% · 789 NODES
  </text>
</svg>
